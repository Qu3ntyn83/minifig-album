services:
  minifig-album:
    image: ghcr.io/qu3ntyn83/minifig-album:latest
    # Lokal bauen statt Image ziehen: nächste Zeile einkommentieren
    # build: .
    container_name: minifig-album
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3020:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Berlin
      - KEEP_BACKUPS=30
      # BrickLink-Preise (gebraucht): Zugangsdaten aus .env, siehe README
      - BL_CONSUMER_KEY=${BL_CONSUMER_KEY:-}
      - BL_CONSUMER_SECRET=${BL_CONSUMER_SECRET:-}
      - BL_TOKEN_VALUE=${BL_TOKEN_VALUE:-}
      - BL_TOKEN_SECRET=${BL_TOKEN_SECRET:-}
      - PRICE_CURRENCY=EUR
      - PRICE_REFRESH_DAYS=7
      # Neue Serien: täglich prüfen, F1-Rennwagen (keine Minifiguren) auslassen
      - CATALOG_CHECK_HOURS=24
      - CATALOG_SKIP=71049
